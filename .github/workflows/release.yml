name: release

# A pushed v* tag builds and publishes the release. Run by hand, it builds all files and keeps
# them as workflow artifacts only (a dry run: nothing is published).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The installer compiler. Pinned, and checked against this SHA-256 before it runs.
  INNO_VERSION: 7.1.0
  INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
  # The anyplay-gg/network revision whose net service the launcher carries.
  NETWORK_REF: main
  # AnyPlay's own cloud, set as a repository variable once it runs; empty until then.
  ANYPLAY_DEFAULT_CLOUD: ${{ vars.ANYPLAY_DEFAULT_CLOUD }}

jobs:
  # The licences of every third-party crate in the launcher and the net service it carries. Every
  # package ships the file, and the release carries it beside the portable exe.
  notices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: launcher
      - uses: actions/checkout@v7.0.1
        with:
          repository: anyplay-gg/network
          ref: ${{ env.NETWORK_REF }}
          path: network
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Third-party licences
        run: tools/notices.sh dist/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-notices
          path: launcher/dist/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  windows:
    needs: notices
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: launcher
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: launcher
      # The online crates come from anyplay-gg/network, checked out beside the launcher.
      - uses: actions/checkout@v7.0.1
        with:
          repository: anyplay-gg/network
          ref: ${{ env.NETWORK_REF }}
          path: network

      - name: Version
        id: version
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            throw 'no version in [workspace.package] of Cargo.toml'
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            launcher
            network

      # The net service is built first, with the C runtime linked statically like the launcher,
      # and carried inside the launcher's exe.
      - name: Net service
        working-directory: network
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p anyplay-net --target x86_64-pc-windows-msvc
          git rev-parse HEAD
          "ANYPLAY_NET_EMBED=$((Resolve-Path target/x86_64-pc-windows-msvc/release/anyplay-net.exe).Path)" >> $env:GITHUB_ENV

      # .cargo/config.toml links the C runtime statically (crt-static).
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Portable exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/AnyPS5-Launcher-${{ steps.version.outputs.version }}-x64.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/anyps5-launcher.exe $exe
          # A statically linked runtime leaves no import of the Visual C++ runtime DLLs.
          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($dll in 'VCRUNTIME140', 'MSVCP140') {
            if ($text -match $dll) { throw "$dll is still imported: the runtime is not static" }
          }

      - name: Install Inno Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest -UseBasicParsing -OutFile $setup `
            "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION.Replace('.', '_'))/innosetup-$env:INNO_VERSION-x64.exe"
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) {
            throw 'the Inno Setup download does not match the pinned SHA-256'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          if (-not (Test-Path "$dir/ISCC.exe")) { throw 'Inno Setup did not install' }
          "INNO_DIR=$dir" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist-notices
          path: launcher/notices

      - name: Installer
        run: |
          $exe = (Resolve-Path "dist/AnyPS5-Launcher-${{ steps.version.outputs.version }}-x64.exe").Path
          $notices = (Resolve-Path notices/THIRD-PARTY-LICENSES.txt).Path
          & "$env:INNO_DIR/ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DExeSource=$exe" "/DNoticesSource=$notices" "/DOutputDir=$((Resolve-Path dist).Path)" tools/installer/anyps5-launcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-windows
          path: launcher/dist/*
          if-no-files-found: error

  # Built on the oldest runner image still offered: a binary links against the glibc it is built
  # with, and an older one runs on more distributions.
  linux:
    needs: notices
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: launcher
      # The online crates come from anyplay-gg/network, checked out beside the launcher.
      - uses: actions/checkout@v7.0.1
        with:
          repository: anyplay-gg/network
          ref: ${{ env.NETWORK_REF }}
          path: network

      - name: Version
        id: version
        run: |
          version=$(awk '/^\[workspace\.package\]/{p=1;next} p&&/^version[ ]*=/{gsub(/[" ]/,"",$0);sub(/^version=/,"",$0);print;exit}' Cargo.toml)
          if [ -z "$version" ]; then echo 'no version in [workspace.package] of Cargo.toml'; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            launcher
            network

      - name: Net service
        working-directory: network
        run: |
          cargo build --release --locked -p anyplay-net
          git rev-parse HEAD
          echo "ANYPLAY_NET_EMBED=$PWD/target/release/anyplay-net" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist-notices
          path: launcher/notices

      - name: Package
        run: tools/linux/package.sh "${{ steps.version.outputs.version }}" target/release/anyps5-launcher notices/THIRD-PARTY-LICENSES.txt dist

      - name: Check the AppImage
        run: |
          appimage="dist/AnyPS5-Launcher-${{ steps.version.outputs.version }}-x86_64.AppImage"
          file "$appimage"
          file "$appimage" | grep -q 'ELF 64-bit'
          # 64-bit ELF with the AppImage type 2 magic after the ELF header.
          test "$(dd if="$appimage" bs=1 skip=8 count=3 2>/dev/null | xxd -p)" = 414902
          # The highest glibc symbol version the binary needs.
          objdump -T target/release/anyps5-launcher | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-linux
          path: launcher/dist/*
          if-no-files-found: error

  # One checksum file for everything, and the release itself (tags only).
  publish:
    needs: [notices, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -b AnyPS5-Launcher-* THIRD-PARTY-LICENSES.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: anyps5-launcher-${{ needs.windows.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: AnyPS5 Launcher ${{ needs.windows.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AnyPS5-Launcher-${{ needs.windows.outputs.version }}-x64.exe
            dist/AnyPS5-Launcher-${{ needs.windows.outputs.version }}-Setup.exe
            dist/AnyPS5-Launcher-${{ needs.windows.outputs.version }}-x86_64.AppImage
            dist/AnyPS5-Launcher-${{ needs.windows.outputs.version }}-linux-x86_64.tar.gz
            dist/THIRD-PARTY-LICENSES.txt
            dist/SHA256SUMS.txt
