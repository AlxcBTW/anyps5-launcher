[workspace]
resolver = "3"
members = ["crates/anyps5-core", "crates/anyps5-launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/AlxcBTW/anyps5-launcher"
rust-version = "1.88"

[workspace.dependencies]
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
gilrs = "0.11"
rodio = "0.23"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
